<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ school_name }} · AI 스케줄 비서</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="min-h-screen pb-24">

<div class="aurora-bg">
  <span class="blob-violet"></span>
  <span class="blob-blue"></span>
  <span class="blob-plum"></span>
</div>

<!-- 헤더 -->
<header class="sticky top-0 z-30 px-4 md:px-8 pt-4">
  <div class="glass-card rounded-2xl px-5 py-3 flex items-center justify-between max-w-7xl mx-auto">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center text-lg">✨</div>
      <div>
        <p class="font-bold leading-tight">{{ school_name }}</p>
        <p class="text-xs text-white/50 leading-tight">AI 스케줄 비서 · {{ ai_name }}</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span id="userLabel" class="text-sm text-white/70 hidden sm:inline"></span>
      <button id="logoutBtn" class="btn-pill-outline text-xs px-4 py-2">로그아웃</button>
    </div>
  </div>
</header>

<!-- 메인 컨텐츠 -->
<main class="max-w-7xl mx-auto px-4 md:px-8 mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

  <!-- 왼쪽 (2/3): 시간표 + 투두 + 메모 -->
  <div class="lg:col-span-2 space-y-6">

    <!-- 시간표 -->
    <section class="glass-card rounded-2xl p-5 fade-in">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-lg">📅 주간 시간표</h2>
        <button id="toggleScheduleForm" class="btn-ghost-icon text-sm text-white/70 px-3 py-1.5">+ 과목 추가</button>
      </div>

      <form id="scheduleForm" class="hidden grid grid-cols-2 sm:grid-cols-5 gap-2 mb-4 text-sm">
        <select name="day_of_week" class="glass-input rounded-lg px-2 py-2">
          <option value="0">월</option><option value="1">화</option><option value="2">수</option>
          <option value="3">목</option><option value="4">금</option>
        </select>
        <input type="number" name="period" min="1" max="9" placeholder="교시" required class="glass-input rounded-lg px-2 py-2">
        <input type="text" name="subject" placeholder="과목명" required class="glass-input rounded-lg px-2 py-2 col-span-2 sm:col-span-1">
        <input type="text" name="room" placeholder="교실 (선택)" class="glass-input rounded-lg px-2 py-2">
        <button type="submit" class="btn-pill text-xs py-2 col-span-2 sm:col-span-1">추가</button>
      </form>

      <div class="overflow-x-auto">
        <table class="w-full text-xs sm:text-sm border-separate" style="border-spacing: 6px;">
          <thead>
            <tr class="text-white/50">
              <th class="w-10"></th>
              <th>월</th><th>화</th><th>수</th><th>목</th><th>금</th>
            </tr>
          </thead>
          <tbody id="timetableBody"></tbody>
        </table>
      </div>
      <p id="timetableEmpty" class="hidden text-center text-white/40 text-sm py-6">등록된 시간표가 없어요. 위에서 과목을 추가해보세요.</p>
    </section>

    <!-- To-Do -->
    <section class="glass-card rounded-2xl p-5 fade-in">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-bold text-lg">✅ To-Do & 숙제</h2>
        <span id="todoCount" class="text-xs text-white/50"></span>
      </div>

      <form id="todoForm" class="flex flex-wrap gap-2 mb-4 text-sm">
        <input type="text" name="title" placeholder="할 일을 입력하세요" required
          class="glass-input rounded-full px-4 py-2 flex-1 min-w-[160px]">
        <input type="date" name="due_date" class="glass-input rounded-full px-3 py-2">
        <button type="submit" class="btn-pill text-xs px-5 py-2">추가</button>
      </form>

      <ul id="todoList" class="space-y-2"></ul>
      <p id="todoEmpty" class="hidden text-center text-white/40 text-sm py-6">할 일이 없어요. 잘 하고 있어요! 🎉</p>
    </section>

    <!-- 메모 -->
    <section class="glass-card rounded-2xl p-5 fade-in">
      <h2 class="font-bold text-lg mb-4">📝 학생 메모장</h2>
      <form id="memoForm" class="mb-4">
        <textarea name="content" rows="3" placeholder="자유롭게 메모를 남겨보세요. 예) 내일까지 수학 3단원 문제집 풀어가기, 금요일 미술 준비물 챙기기"
          class="glass-input w-full rounded-xl px-4 py-3 text-sm resize-none"></textarea>
        <div class="flex justify-end mt-2">
          <button type="submit" class="btn-pill text-xs px-5 py-2">메모 저장</button>
        </div>
      </form>
      <div id="memoList" class="space-y-3"></div>
      <p id="memoEmpty" class="hidden text-center text-white/40 text-sm py-6">아직 작성한 메모가 없어요.</p>
    </section>
  </div>

  <!-- 오른쪽 (1/3): 급식 + 공지 -->
  <div class="space-y-6">
    <section class="glass-card rounded-2xl p-5 fade-in">
      <h2 class="font-bold text-lg mb-4">🍚 오늘의 급식</h2>
      <div id="mealList" class="space-y-3 text-sm"></div>
      <p id="mealEmpty" class="hidden text-center text-white/40 text-sm py-4">오늘 급식 정보가 없어요.</p>
    </section>

    <section class="glass-card rounded-2xl p-5 fade-in">
      <h2 class="font-bold text-lg mb-4">📢 학교 공지사항</h2>
      <div id="noticeList" class="space-y-3 text-sm"></div>
    </section>
  </div>
</main>

<!-- 챗봇 플로팅 버튼 -->
<button id="chatToggleBtn"
  class="fixed bottom-6 right-6 z-40 w-14 h-14 rounded-full btn-pill flex items-center justify-center text-2xl shadow-xl">
  💬
</button>

<!-- 챗봇 패널 -->
<div id="chatPanel" class="chat-panel hidden-panel fixed bottom-24 right-6 z-40 w-[92vw] max-w-sm h-[70vh] max-h-[560px]
  glass-card rounded-2xl flex flex-col overflow-hidden">
  <div class="flex items-center justify-between px-4 py-3 border-b border-white/10">
    <div>
      <p class="font-bold text-sm">{{ ai_name }}</p>
      <p class="text-xs text-white/50">시간표·할일·급식·공지를 알고 있어요</p>
    </div>
    <button id="chatCloseBtn" class="btn-ghost-icon w-8 h-8 flex items-center justify-center">✕</button>
  </div>
  <div id="chatMessages" class="flex-1 overflow-y-auto px-4 py-4 space-y-3 text-sm"></div>
  <form id="chatForm" class="p-3 border-t border-white/10 flex gap-2">
    <input type="text" id="chatInput" placeholder="무엇이든 물어보세요" autocomplete="off"
      class="glass-input flex-1 rounded-full px-4 py-2 text-sm">
    <button type="submit" class="btn-pill w-10 h-10 flex items-center justify-center text-sm">➤</button>
  </form>
</div>

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
